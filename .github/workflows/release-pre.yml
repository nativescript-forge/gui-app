name: 🧪 Pre-Release (Alpha / Beta)

on:
  push:
    tags:
      - 'v*.*.*-alpha*'   # contoh: v1.0.0-alpha, v1.0.0-alpha.1
      - 'v*.*.*-beta*'    # contoh: v1.0.0-beta, v1.0.0-beta.2

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: 🗄️ Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🐧 Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🧪 Build Tauri app & Upload to Pre-Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NativeScript Forge ${{ github.ref_name }}'
          releaseBody: |
            ## 🧪 NativeScript Forge ${{ github.ref_name }} (Pre-Release)

            > ⚠️ Ini adalah versi **pre-release** dan mungkin masih mengandung bug.
            > Tidak disarankan untuk penggunaan production.

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` (installer), `.msi` |
            | 🍎 macOS Intel | `.dmg` |
            | 🍎 macOS Apple Silicon | `.dmg` |
            | 🐧 Linux | `.deb`, `.AppImage` |
          releaseDraft: false    # Langsung publish sebagai pre-release
          prerelease: true       # ✅ Ditandai Pre-release
          args: ${{ matrix.platform.args }}
