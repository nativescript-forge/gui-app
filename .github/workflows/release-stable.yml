name: 🚀 Release (Stable)

on:
  push:
    tags:
      - '*.*.*'           # contoh: 1.0.0, 1.2.3

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    if: |
      !contains(github.ref_name, 'alpha') &&
      !contains(github.ref_name, 'beta')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin

          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: 🗄️ Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🐧 Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: 📦 Install frontend dependencies
        run: npm install --prefer-offline --no-audit

      - name: 🏗️ Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.platform.target }}

      - name: 📤 Upload artifacts (Windows)
        if: matrix.platform.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true        # ✅ Draft dulu, publish manual
          prerelease: false
          body: |
            ## 🚀 NativeScript Forge ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` (installer), `.msi` |
            | 🍎 macOS Intel | `.dmg` |
            | 🍎 macOS Apple Silicon | `.dmg` |
            | 🐧 Linux | `.deb`, `.AppImage` |
          files: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi

      - name: 📤 Upload artifacts (macOS)
        if: matrix.platform.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NativeScript Forge ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg

      - name: 📤 Upload artifacts (Linux)
        if: matrix.platform.os == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NativeScript Forge ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
