name: 🚀 Release (Stable)

on:
  push:
    tags:
      - 'v*.*.*'          # contoh: v1.0.0, v1.2.3
    branches-ignore:
      - '**'              # Hanya jalan via tag, bukan branch

# Filter agar TIDAK jalan jika tag mengandung alpha/beta
# Dilakukan lewat job-level if condition
jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    # Jika tag mengandung 'alpha' atau 'beta', skip seluruh job ini
    if: |
      !contains(github.ref_name, 'alpha') &&
      !contains(github.ref_name, 'beta')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'

          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'

          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: 🗄️ Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🐧 Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🚀 Build Tauri app & Upload to Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NativeScript Forge ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 NativeScript Forge ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` (installer), `.msi` |
            | 🍎 macOS Intel | `.dmg` |
            | 🍎 macOS Apple Silicon | `.dmg` |
            | 🐧 Linux | `.deb`, `.AppImage` |

            > Lihat [commit history](https://github.com/nativescript-forge/gui-app/commits) untuk detail perubahan.
          releaseDraft: true     # ✅ Draft dulu, kamu publish manual setelah dicek
          prerelease: false      # Bukan pre-release
          args: ${{ matrix.platform.args }}
